<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6faef">
<meta name="description" content="移动端学分加权平均成绩计算器">
<meta property="og:title" content="学分计算器·手机版">
<meta property="og:description" content="填写成绩与学分，实时计算加权平均成绩">
<title>学分计算器 · 手机版</title>
<style>
:root{color-scheme:light;--ink:#203b2c;--muted:#6a7c6d;--green:#226845;--line:#dfe7d8;--lemon:#eef78a}
*{box-sizing:border-box}body{margin:0;background:#f6faef;color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}main{width:100%;max-width:540px;margin:auto;padding:28px 18px calc(110px + env(safe-area-inset-bottom))}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--green)}.eyebrow:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#c7da46;margin-right:8px}h1{font-size:30px;letter-spacing:-1px;margin:10px 0 6px}.intro{font-size:14px;color:var(--muted);line-height:1.7;margin:0 0 22px}.result{background:var(--green);color:#fff;border-radius:24px;padding:23px;box-shadow:0 10px 26px #22684515}.result-title{margin:0;font-size:14px;font-weight:500;color:#e1eddb}.average{font-size:62px;font-weight:750;letter-spacing:-2px;line-height:1.2;margin-top:8px;overflow-wrap:anywhere}.average small{font-size:16px;letter-spacing:0;color:#d8e9d1;margin-left:8px;font-weight:400}.stats{display:flex;gap:22px;border-top:1px solid #ffffff29;margin-top:17px;padding-top:15px;flex-wrap:wrap;font-size:12px;color:#d8e9d1}.stats strong{font-size:17px;color:#fff;margin-left:5px;font-weight:650;overflow-wrap:anywhere}.status{font-size:13px;color:var(--muted);line-height:1.65;margin:13px 2px 22px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}h2{font-size:18px;margin:0}button{font:inherit;cursor:pointer;touch-action:manipulation;min-height:44px;border:0}.clear{background:none;color:var(--muted);padding:8px;font-size:13px}.course{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}.course-head{display:flex;justify-content:space-between;align-items:center;margin-top:-5px;margin-bottom:8px}h3{font-size:13px;color:var(--green);margin:0;font-weight:650}.remove{color:#8b6356;background:none;font-size:13px;padding:8px 10px;margin-right:-8px}label{display:block;font-size:13px;font-weight:550;min-width:0}.optional{color:var(--muted);font-weight:400;font-size:12px}input{display:block;min-width:0;width:100%;min-height:48px;margin:7px 0 0;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fcfdf9;color:var(--ink);font:400 16px system-ui,-apple-system,"PingFang SC",sans-serif}input:focus{outline:3px solid #93bca1;outline-offset:2px}input[aria-invalid=true]{border-color:#b35b43;background:#fff9f5}.numbers{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:14px}.error{font-size:12px;font-weight:400;color:#a34b35;margin:5px 0 0;line-height:1.5;min-height:0}.error:empty{display:none}.note{color:var(--muted);font-size:12px;line-height:1.8;margin:20px 3px 0}.dock{position:fixed;bottom:0;left:0;right:0;z-index:2;background:#f6faeff5;border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom))}.dock-inner{max-width:504px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.mini{font-size:11px;color:var(--muted);min-width:0}.mini strong{display:block;color:var(--green);font-size:23px;font-weight:750;line-height:1.3}.add{background:var(--lemon);color:#33440e;border:1px solid #dce573;border-radius:14px;padding:13px 24px;font-size:15px;font-weight:700;flex-shrink:0}@media(max-width:350px){main{padding-left:12px;padding-right:12px}.result{padding:20px}.course{padding:14px}.add{padding-left:16px;padding-right:16px}}
</style>
</head>
<body><main><header><div class="eyebrow">轻松算学分</div><h1>每一份努力，都算数。</h1><p class="intro">填入成绩与学分，实时计算加权平均成绩。</p></header><section class="result"><h2 class="result-title">加权平均成绩</h2><div class="average"><span id="average">—</span><small>/ 100</small></div><div class="stats"><span>已计入<strong id="count">0 门</strong></span><span>总学分<strong id="credits">0</strong></span></div></section><p class="status" id="status" role="status" aria-live="polite">填写一门课程的成绩和学分，开始计算。</p><section><div class="section-head"><h2>我的课程</h2><button type="button" class="clear" id="clear">清空全部</button></div><div id="courses"></div></section><p class="note">计算方式：所有“成绩 × 学分”之和 ÷ 总学分。<br>仅计入完整且有效的课程，结果保留两位小数。<br>本页不保存数据，刷新或关闭后需重新输入。</p></main><footer class="dock"><div class="dock-inner"><div class="mini">加权平均成绩<strong id="miniAverage">—</strong></div><button type="button" class="add" id="add">＋ 添加课程</button></div></footer><template id="courseTemplate"><article class="course"><div class="course-head"><h3></h3><button type="button" class="remove">删除</button></div><label>课程名称 <span class="optional">· 可选</span><input class="name" type="text" placeholder="填写课程名称" autocomplete="off"></label><div class="numbers"><label>成绩 <span class="optional">· 百分制</span><input class="score" type="number" inputmode="decimal" min="0" max="100" step="any" placeholder="0–100"><span class="error"></span></label><label>学分<input class="credit" type="number" inputmode="decimal" min="0" step="any" placeholder="例如 3.5"><span class="error"></span></label></div></article></template><script>
'use strict';const courses=document.getElementById('courses'),template=document.getElementById('courseTemplate');let nextId=0;const fmt=new Intl.NumberFormat('zh-CN',{maximumFractionDigits:8});
function validate(v,k,bad){if(bad)return{error:'请输入有效数字'};if(v.trim()==='')return{empty:true};const n=Number(v);if(!Number.isFinite(n))return{error:'请输入有效数字'};if(k==='score'&&(n<0||n>100))return{error:'成绩应在 0–100 之间'};if(k==='credit'&&n<=0)return{error:'学分必须大于 0'};return{number:n}}
function update(){const rows=[...courses.children],entries=rows.map((r,i)=>{r.querySelector('h3').textContent='课程 '+String(i+1).padStart(2,'0');const e={name:r.querySelector('.name').value};for(const k of ['score','credit']){const x=r.querySelector('.'+k),v=validate(x.value,k,x.validity.badInput);x.setAttribute('aria-invalid',String(!!v.error));x.nextElementSibling.textContent=v.error||'';e[k]=x.value;e[k+'Bad']=x.validity.badInput}return e});let c=0,w=0,p=0;for(const e of entries){const s=validate(e.score,'score',e.scoreBad),cr=validate(e.credit,'credit',e.creditBad);if(s.error||cr.error||s.empty||cr.empty){if(e.name.trim()||e.score||e.credit||s.error||cr.error)p++;continue}c++;w+=s.number*cr.number}const avg=c&&Number.isFinite(w)?w/(entries.filter(e=>{const s=validate(e.score,'score',e.scoreBad),cr=validate(e.credit,'credit',e.creditBad);return !s.error&&!cr.error&&!s.empty&&!cr.empty}).reduce((a,e)=>a+Number(e.credit),0)):null;const a=avg===null?'—':avg.toFixed(2);document.getElementById('average').textContent=a;document.getElementById('miniAverage').textContent=a;document.getElementById('count').textContent=c+' 门';document.getElementById('credits').textContent=fmt.format(entries.reduce((a,e)=>{const cr=validate(e.credit,'credit',e.creditBad);return !cr.error&&!cr.empty?a+cr.number:a},0));document.getElementById('status').textContent=p?'还有 '+p+' 门课程未填完整或有错误，暂未计入。':c?'已计入 '+c+' 门课程，平均成绩 '+a+' 分。':'填写一门课程的成绩和学分，开始计算。'}
function addCourse(focus){const row=template.content.firstElementChild.cloneNode(true),id=++nextId;for(const k of ['score','credit'])row.querySelector('.'+k).nextElementSibling.id=k+'-error-'+id;row.querySelector('.remove').onclick=()=>{row.remove();if(!courses.children.length)addCourse(true);update()};courses.appendChild(row);update();if(focus)row.querySelector('.name').focus()}
courses.oninput=update;document.getElementById('add').onclick=()=>addCourse(true);document.getElementById('clear').onclick=()=>{if([...courses.querySelectorAll('input')].some(x=>x.value)&&!confirm('清空所有课程？'))return;courses.replaceChildren();addCourse(true)};addCourse(false);
</script></body></html>
